<svg width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" fill="#0a0a0a"/>
  <!-- Trie tree structure -->
  <!-- Root -->
  <circle cx="200" cy="35" r="10" fill="none" stroke="#fff" stroke-width="1"/>
  <text x="200" y="39" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">*</text>
  <!-- Level 1 -->
  <line x1="200" y1="45" x2="100" y2="80" stroke="#444" stroke-width="0.5"/>
  <line x1="200" y1="45" x2="200" y2="80" stroke="#444" stroke-width="0.5"/>
  <line x1="200" y1="45" x2="300" y2="80" stroke="#444" stroke-width="0.5"/>
  <circle cx="100" cy="90" r="10" fill="none" stroke="#666" stroke-width="0.5"/>
  <text x="100" y="94" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">a</text>
  <circle cx="200" cy="90" r="10" fill="none" stroke="#666" stroke-width="0.5"/>
  <text x="200" y="94" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">s</text>
  <circle cx="300" cy="90" r="10" fill="none" stroke="#666" stroke-width="0.5"/>
  <text x="300" y="94" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">t</text>
  <!-- Level 2 -->
  <line x1="100" y1="100" x2="60" y2="135" stroke="#333" stroke-width="0.5"/>
  <line x1="100" y1="100" x2="130" y2="135" stroke="#333" stroke-width="0.5"/>
  <line x1="200" y1="100" x2="175" y2="135" stroke="#333" stroke-width="0.5"/>
  <line x1="200" y1="100" x2="225" y2="135" stroke="#333" stroke-width="0.5"/>
  <line x1="300" y1="100" x2="280" y2="135" stroke="#333" stroke-width="0.5"/>
  <line x1="300" y1="100" x2="330" y2="135" stroke="#333" stroke-width="0.5"/>
  <circle cx="60" cy="145" r="8" fill="none" stroke="#444" stroke-width="0.5"/>
  <text x="60" y="149" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">l</text>
  <circle cx="130" cy="145" r="8" fill="none" stroke="#444" stroke-width="0.5"/>
  <text x="130" y="149" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">n</text>
  <circle cx="175" cy="145" r="8" fill="none" stroke="#444" stroke-width="0.5"/>
  <text x="175" y="149" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">e</text>
  <circle cx="225" cy="145" r="8" fill="none" stroke="#444" stroke-width="0.5"/>
  <text x="225" y="149" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">o</text>
  <circle cx="280" cy="145" r="8" fill="none" stroke="#444" stroke-width="0.5"/>
  <text x="280" y="149" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">r</text>
  <circle cx="330" cy="145" r="8" fill="none" stroke="#333" stroke-width="0.5"/>
  <text x="330" y="149" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">u</text>
  <!-- Level 3 leaf nodes -->
  <line x1="60" y1="153" x2="40" y2="178" stroke="#222" stroke-width="0.5"/>
  <line x1="60" y1="153" x2="75" y2="178" stroke="#222" stroke-width="0.5"/>
  <line x1="175" y1="153" x2="165" y2="178" stroke="#222" stroke-width="0.5"/>
  <line x1="280" y1="153" x2="270" y2="178" stroke="#222" stroke-width="0.5"/>
  <line x1="280" y1="153" x2="295" y2="178" stroke="#222" stroke-width="0.5"/>
  <circle cx="40" cy="185" r="6" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <circle cx="75" cy="185" r="6" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <circle cx="165" cy="185" r="6" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <circle cx="270" cy="185" r="6" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <circle cx="295" cy="185" r="6" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <!-- edit distance label -->
  <rect x="130" y="200" width="140" height="18" rx="2" fill="#111" stroke="#2a2a2a" stroke-width="0.5"/>
  <text x="200" y="213" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">edit distance ≤ 2</text>
  <text x="200" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#333" letter-spacing="0.08em">C++ TRIE ENGINE</text>
</svg>
