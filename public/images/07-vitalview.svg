<svg width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" fill="#0a0a0a"/>
  <!-- Vision Pro frame hint - curved visor shape -->
  <path d="M60 100 Q60 50 200 45 Q340 50 340 100 Q340 175 200 190 Q60 175 60 100Z" fill="none" stroke="#1e1e1e" stroke-width="0.5"/>
  <!-- Floating panels in 3D space -->
  <!-- Main health panel -->
  <rect x="110" y="65" width="180" height="90" rx="4" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="0.5" opacity="0.95"/>
  <text x="200" y="85" text-anchor="middle" font-family="monospace" font-size="8" fill="#444" letter-spacing="0.1em">HEART RATE</text>
  <text x="200" y="110" text-anchor="middle" font-family="monospace" font-size="28" fill="#fff" font-weight="300">72</text>
  <text x="200" y="126" text-anchor="middle" font-family="monospace" font-size="8" fill="#444">BPM · NORMAL</text>
  <!-- Heartbeat line -->
  <polyline points="120,145 140,145 150,130 158,158 165,130 172,145 270,145" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <!-- Side floating card left -->
  <rect x="28" y="85" width="72" height="50" rx="3" fill="#0d0d0d" stroke="#222" stroke-width="0.5" opacity="0.8"/>
  <text x="64" y="103" text-anchor="middle" font-family="monospace" font-size="7" fill="#3a3a3a">SLEEP</text>
  <text x="64" y="120" text-anchor="middle" font-family="monospace" font-size="14" fill="#666">7.2h</text>
  <!-- Side floating card right -->
  <rect x="300" y="85" width="72" height="50" rx="3" fill="#0d0d0d" stroke="#222" stroke-width="0.5" opacity="0.8"/>
  <text x="336" y="103" text-anchor="middle" font-family="monospace" font-size="7" fill="#3a3a3a">STEPS</text>
  <text x="336" y="120" text-anchor="middle" font-family="monospace" font-size="14" fill="#666">8.4k</text>
  <!-- Depth lines suggesting 3D float -->
  <line x1="100" y1="135" x2="28" y2="135" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="290" y1="135" x2="372" y2="135" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,3"/>
  <!-- Medication reminder bubble -->
  <rect x="140" y="168" width="120" height="18" rx="9" fill="#161616" stroke="#2a2a2a" stroke-width="0.5"/>
  <text x="200" y="181" text-anchor="middle" font-family="monospace" font-size="7" fill="#555">💊 Reminder · 9:00 PM</text>
  <text x="200" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#333" letter-spacing="0.08em">VITALVIEW · visionOS</text>
</svg>
